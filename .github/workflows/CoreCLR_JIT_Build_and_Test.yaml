name: CoreCLR JIT Build and Test

on:
  pull_request:
    branches:
      - ppc64le_coreclr_jit

concurrency:
  group: jit-testing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jit-testing:
    runs-on: ubuntu-24.04-ppc64le-p10
    # Only run when the PR originates from a branch within the same repository (not a fork)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # ======================================
      # Ensure PR targets the correct branch
      # ======================================
      - name: Fail if PR does not target ppc64le_coreclr_jit
        if: github.base_ref != 'ppc64le_coreclr_jit'
        run: |
          echo "This workflow is only allowed on PRs targeting the ppc64le_coreclr_jit branch"
          exit 1

      # ======================================
      # Checkout
      # ======================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ======================================
      # Clean old container
      # ======================================
      - name: Stop and Remove Existing Container
        run: docker rm -f gha 2>/dev/null || true
        continue-on-error: true

      # ======================================
      # Start container
      # ======================================
      - name: Start Container
        run: |
          docker run -dit \
            --privileged \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            --network host \
            --name gha \
            ubuntu:22.04

      # ======================================
      # Copy script
      # ======================================
      - name: Copy Script
        run: |
          docker cp .github/workflows/jit_testing.sh gha:/jit_testing.sh
          docker exec gha chmod +x /jit_testing.sh

      # ======================================
      # INSTALL + SETUP (runs once)
      # ======================================
      - name: Setup Environment
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh setup 2>&1 | tee /tmp/setup.log
          '

      # ======================================
      # BUILD STAGES
      # ======================================
      - name: Build Runtime
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh build_runtime 2>&1 | tee /tmp/build_runtime.log
          '

      - name: Build Libraries
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh build_libs 2>&1 | tee /tmp/build_libs.log
          '

      - name: Build Tests
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh build_tests 2>&1 | tee /tmp/build_tests.log
          '

      # ======================================
      # TEST STAGE
      # ======================================
      - name: Run JIT Tests
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh run_tests 2>&1 | tee /tmp/jit_tests.log
          '

      # ======================================
      # RUN CORECLR JIT TESTSUITE
      # ======================================
      - name: Run CoreCLR JIT Testsuite
        continue-on-error: true
        run: |
          docker exec gha bash -c '
            set -euo pipefail
            /jit_testing.sh run_coreclr_tests 2>&1 | tee /tmp/run_coreclr_tests.log
          '

      # ======================================
      # COPY LOGS
      # ======================================
      - name: Copy Logs
        if: always()
        run: |
          docker cp gha:/tmp ./logs 2>/dev/null || echo "No logs found"
          docker cp gha:/tmp/Test_logs ./logs/Test_logs 2>/dev/null || echo "No Test_logs found"
        continue-on-error: true

      # ======================================
      # UPLOAD LOGS
      # ======================================
      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

      # ======================================
      # CLEANUP
      # ======================================
      - name: Cleanup Container
        if: always()
        run: |
          docker stop gha 2>/dev/null || true
          docker rm gha 2>/dev/null || true
        continue-on-error: true

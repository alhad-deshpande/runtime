name: JIT Testing Pipeline

on:
  push:               # Runs on every commit
  pull_request:       # Runs on PRs
  workflow_dispatch:  # Optional manual trigger

jobs:
  jit-testing:
    runs-on: ubuntu-24.04-ppc64le-p10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Container
        run: |
          # Remove old container if exists
          docker rm -f gha 2>/dev/null || true

          # Run new container
          docker run -dit \
            --privileged \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            --network host \
            --name gha \
            ubuntu:22.04

      - name: Wait for Container
        run: |
          sleep 5
          docker ps

      - name: Copy Script to Container
        run: |
          docker cp .github/workflows/jit_testing.sh gha:/jit_testing.sh
          docker exec gha chmod +x /jit_testing.sh

      - name: Run Script
        run: |
          docker exec gha bash -c "/jit_testing.sh"

name: JIT Testing Pipeline

on:
 push:
    branches:
      - ppc64le_coreclr_jit
  workflow_dispatch:

jobs:
  jit-testing:
    runs-on: ubuntu-24.04-ppc64le-p10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Existing Container
        run: |
          docker rm -f gha || true

      - name: Create Container
        run: |
          docker run -dit \
            --privileged \
            --network host \
            --name gha \
            ubuntu:22.04 \
            bash

      - name: Verify Container
        run: |
          docker ps -a
          docker inspect gha --format='{{.State.Status}}'

      - name: Copy Script
        run: |
          docker cp .github/workflows/jit_testing.sh gha:/root/jit_testing.sh
          docker exec gha chmod +x /root/jit_testing.sh
          docker exec gha ls -l /root/jit_testing.sh

      - name: Run JIT Test Script
        run: |
          docker exec gha bash -c "/root/jit_testing.sh"

      - name: Collect Logs on Failure
        if: failure()
        run: |
          echo "=== Container Status ==="
          docker ps -a
          echo "=== Container Logs ==="
          docker logs gha || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f gha || true

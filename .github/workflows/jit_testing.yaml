name: JIT Testing Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  jit-testing:
    runs-on: ubuntu-24.04-ppc64le-p10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Existing Container
        run: |
          docker rm -f gha || true

      - name: Create Container
        run: |
          docker run -dit \
            --privileged \
            --network host \
            --name gha \
            ubuntu:22.04 \
            sleep infinity

      - name: Verify Container
        run: |
          docker ps -a

      - name: Copy Script
        run: |
          docker cp .github/workflows/jit_testing.sh gha:/root/jit_testing.sh
          docker exec gha chmod +x /root/jit_testing.sh

      - name: Run JIT Testing
        run: |
          docker exec gha bash -lc "/root/jit_testing.sh"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f gha || true

name: Trigger ppc64le build on GHA

on:
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, synchronize, reopened]
  # schedule:
  #   - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:


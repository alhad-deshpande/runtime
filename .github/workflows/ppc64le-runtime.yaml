name: Runtime-Build-Test

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  CheckPoint:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@Dotnet_ppc64le')
    outputs:
      command: ${{ steps.check_comment.outputs.command }}
    steps:
      - name: Parse comment
        id: check_comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body || "";
            let command = "";
            if (comment.includes("@Dotnet_ppc64le cancel")) {
              command = "cancel";
            } else if (comment.includes("@Dotnet_ppc64le")) {
              // default to build if 'build' or just the tag is present
              command = "build";
            }
            if (command) {
              core.setOutput("command", command);
            } else {
              core.setOutput("command", "");
            }
  runtime-build-test:
    needs: CheckPoint
    if: needs.CheckPoint.outputs.command == 'build'
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Get PR SHA
        id: get_pr
        if: github.event.issue.pull_request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prUrl = context.payload.issue.pull_request.url;
            const pr = await github.request(prUrl);
            const sha = pr.data.head.sha;
            core.setOutput("sha", sha);
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Container
        run: |
          docker stop github-api && docker rm github-api
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --network host --name github-api ubuntu:22.04
      - name: Copy script
        run: |
          docker cp /root/ashutosh/api/runtime-runner/.github/workflows/runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh
      - name: Build
        run: |
          docker exec github-api bash -c "/runtime.sh --sdk_version 10.0.100-preview.6.25315.102 --ref ${{ steps.get_pr.outputs.sha }} --build 2>&1 | tee /tmp/runtime-build.log; exit \${PIPESTATUS[0]}"
      - name: Test
        run: |
          docker exec github-api bash -c "/runtime.sh --sdk_version 10.0.100-preview.6.25315.102 --ref ${{ steps.get_pr.outputs.sha }} --test 2>&1 | tee /tmp/runtime-test.log; exit \${PIPESTATUS[0]}"
  cancel-job:
    needs: CheckPoint
    if: needs.CheckPoint.outputs.command == 'cancel'
    runs-on: ubuntu-24.04-ppc64le
    steps:
      - name: Print cancel message
        run: echo "Job is canceled as per comment command."

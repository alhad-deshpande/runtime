name: Trigger ppc64le build on GHA

on:
  issue_comment:
    types: [created, edited]

permissions:
  issues: write

jobs:
  ppc64le-trigger:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@Dotnet-ppc64le build') || contains(github.event.comment.body, '@Dotnet-ppc64le cancel')
    outputs:
      command: ${{ steps.check_comment.outputs.command }}
    steps:
      - name: Parse comment
        id: check_comment
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = context.payload.comment.body || "";
            let command = "";

            if (comment.includes("@Dotnet-ppc64le cancel")) {
              command = "cancel";
            } else if (comment.includes("@Dotnet-ppc64le build")) {
              command = "build";
            }

            core.setOutput("command", command);

  ppc64le-runtime-build-test:
    needs: ppc64le-trigger
    if: needs.ppc64le-trigger.outputs.command == 'build'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Get PR SHA
        id: get_pr
        if: github.event.issue.pull_request
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prUrl = context.payload.issue.pull_request.url;
            const pr = await github.request(prUrl);
            const sha = pr.data.head.sha;
            core.setOutput("sha", sha);

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Container
        run: |
          docker stop github-api && docker rm github-api
          docker run -dit --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:ro --network host --name github-api ubuntu:22.04

      - name: Copy script
        run: |
          docker cp .github/workflows/ppc64le-runtime.sh github-api:/runtime.sh
          docker exec github-api chmod +x /runtime.sh

      - name: Build
        run: |
          docker exec github-api bash -c "/runtime.sh --ref ${{ steps.get_pr.outputs.sha }} --build 2>&1 | tee /tmp/runtime-build.log; exit \${PIPESTATUS[0]}"

      - name: Test
        run: |
          docker exec github-api bash -c "/runtime.sh --ref ${{ steps.get_pr.outputs.sha }} --test 2>&1 | tee /tmp/runtime-test.log; exit \${PIPESTATUS[0]}"

  ppc64le-cancel:
    needs: ppc64le-trigger
    if: needs.ppc64le-trigger.outputs.command == 'cancel'
    runs-on: ubuntu-24.04-ppc64le-p10
    steps:
      - name: Print cancel message
        run: echo "Job is canceled as per comment command."
